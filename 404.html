<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKAOs</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0c;color:#fff;font-family:system-ui,sans-serif;text-align:center}a{color:#ffcc00}</style>
<script>
/* Rutas limpias: /ajustes, /settings, /mods, /jugar ... -> pagina real.
   Detecta solo si el sitio vive en una subcarpeta (usuario.github.io/OKAOs/). */
(function () {
    var ROUTES = {
        inicio: "index.html", home: "index.html",
        jugar: "sc/play.html", play: "sc/play.html",
        canciones: "sc/music.html", music: "sc/music.html", songs: "sc/music.html",
        mods: "sc/mods.html",
        perfil: "sc/profile.html", profile: "sc/profile.html",
        ajustes: "sc/settings.html", settings: "sc/settings.html",
        partida: "play/run.html", run: "play/run.html"
    };
    var parts = location.pathname.split("/").filter(Boolean);
    var base = "/";
    for (var i = 0; i < parts.length; i++) {
        var seg = parts[i].replace(/\.html$/, "").toLowerCase();
        if (ROUTES[seg]) {
            window.__target = base + ROUTES[seg] + location.search + location.hash;
            break;
        }
        base += parts[i] + "/";
    }
    if (window.__target) location.replace(window.__target);
})();
</script>
</head>
<body>
<div><h1>Página no encontrada</h1><p><a id="home" href="./">Volver al inicio</a></p></div>
<script>
(function () {
    var parts = location.pathname.split("/").filter(Boolean);
    var repo = location.hostname.slice(-10) === ".github.io" && parts.length ? "/" + parts[0] + "/" : "/";
    document.getElementById("home").href = repo;
})();
</script>
</body>
</html>
